name: Django CI/CD

on: [push, pull_request]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8
      - name: Lint with black
        run: black --check .
      - name: Lint with isort
        run: isort --check-only .
      - name: Lint with flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run migrations
        env:
          SECRET_KEY: test-secret
          DEBUG: 1
          DATABASE_NAME: test_db
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: python manage.py migrate
      - name: Run tests
        env:
          SECRET_KEY: test-secret
          DEBUG: 1
          DATABASE_NAME: test_db
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: python manage.py test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Django app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/edu-web:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/edu-web:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/edu-nginx:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/edu-nginx:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /opt/myproject
            git pull origin main


            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/edu-web:${{ github.sha }}
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/edu-nginx:${{ github.sha }}


            sed -i 's|image: .*/edu-web:.*|image: ${{ secrets.DOCKER_HUB_USERNAME }}/edu-web:${{ github.sha }}|g' docker-compose.yml
            sed -i 's|image: .*/edu-nginx:.*|image: ${{ secrets.DOCKER_HUB_USERNAME }}/edu-nginx:${{ github.sha }}|g' docker-compose.yml


            docker compose up -d --build


          EOF


