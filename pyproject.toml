[project]
name = "pythonprojectdrf2"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "django-filter (>=22.0,<25.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "coverage (>=7.14.1,<8.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "stripe (>=15.2.1,<16.0.0)",
    "celery (==5.5.0)",
    "eventlet (>=0.41.0,<0.42.0)",
    "redis (==7.4.0)",
    "gevent (>=26.5.0,<27.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

